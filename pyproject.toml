[project]
name = "openrhyme-mcp"
version = "0.1.0"
description = "MCP server that exposes the OpenRhyme computer-history timeline to any agent over stdio"
readme = "README.md"
license = "MIT"
authors = [{ name = "OpenRhyme" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "openrhyme", "computer-history", "macos"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1,<3",
]

[project.urls]
Homepage = "https://github.com/OpenRhyme/openrhyme-mcp"
Engine = "https://github.com/OpenRhyme/OpenRhyme"

# Planned console entry point once a server module exists (see CLAUDE.md):
# [project.scripts]
# openrhyme-mcp = "openrhyme_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
